[package]
name = "exhibitos-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
aes-gcm = "=0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
fs2 = "0.4.3"
flate2 = "=1.1.10"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
