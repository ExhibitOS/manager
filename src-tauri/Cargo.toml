[package]
name = "exhibitos-manager-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[lib]
name = "exhibitos_manager_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
exhibitos-lifecycle = { path = "../crates/lifecycle" }
serde = { version = "=1.0.228", features = ["derive"] }
url = "=2.5.8"
open = "=5.4.4"
sha2 = "=0.10.9"
serde_json = "=1.0.151"

[dev-dependencies]
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
